name: homeo
description: "Homeo — reduce cheap dopamine, rebuild focus."
publish_to: "none"
version: 0.1.0+1

environment:
  # เก็บค่า sdk เดิมที่ `flutter create` เขียนไว้ได้เลย
  # (ชุด package ด้านล่างต้องใช้ Dart >= 3.9 — ถ้า pub บ่น ให้ `flutter upgrade`)
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version ถูกล็อกโดย flutter_localizations

  # State management (code-gen)
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.6

  # Routing
  go_router: ^17.0.1

  # Local DB (offline-first)
  drift: ^2.34.1
  drift_flutter: ^0.3.0

  # Background "session finished" alert
  flutter_local_notifications: ^20.1.0
  timezone: any # version is pinned by flutter_local_notifications

  # Encryption of sensitive fields (PRD §24.3)
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.0.0

  # Utils
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.1+1

flutter:
  uses-material-design: true
  generate: true # เปิด gen-l10n (ดู l10n.yaml)

  # ── Fonts (PRD §12.2: Inter) ─────────────────────────────────────────────
  # Inter ไม่มีตัวอักษรไทย → ใช้ Noto Sans Thai เป็น fallback
  # ดาวน์โหลดไฟล์ .ttf (static) ไปวางที่ assets/fonts/ แล้วเอา comment ออก
  # ถ้ายังไม่ได้ทำ แอปยังรันได้ (ใช้ font ของระบบแทน)
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansThai
  #     fonts:
  #       - asset: assets/fonts/NotoSansThai-Regular.ttf
  #       - asset: assets/fonts/NotoSansThai-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansThai-Bold.ttf
  #         weight: 700
