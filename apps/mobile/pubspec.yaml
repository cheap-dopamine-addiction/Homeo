name: homeo
description: "Homeo — reduce cheap dopamine, rebuild focus."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI / Icons
  cupertino_icons: ^1.0.8

  # State management (code-gen)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.0.1

  # Local DB / Storage
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0

  # Network & Services
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0

  # Utils
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true # เปิดใช้งาน gen-l10n

